# Local development infrastructure only. Host ports avoid common defaults so this
# stack can run beside other local services, such as an existing PostgreSQL on 5432.
name: impulse-world

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5544}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d impulse']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-impulse_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-impulse_dev_secret}
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9100}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9101}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${SMTP_HOST_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_HOST_PORT:-8026}:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
